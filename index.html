<style>
/* VOICE: caderno de trabalho calmo e acolhedor de uma professora de AEE da Educação Infantil
   IDEA: a pasta de acompanhamento da criança, com abas coloridas por módulo
   PICTURE: a ferramenta em uso; o painel do dia com a ciranda de atendimentos no topo
   COLOUR and TYPE: azul-petróleo, terracota e areia (identidade dos apps do Pedro); Baloo 2 + Nunito
   LAYOUT: barra lateral no computador, barra inferior no celular, uma coluna calma de conteúdo */
:root{color-scheme:light dark;
--bg:light-dark(#f6efe3,#0f1d21);--card:light-dark(#fffdf8,#16292e);--ink:light-dark(#1c2b2f,#ece4d6);
--mut:light-dark(#5b6a6d,#a7b3b3);--pet:light-dark(#1f5a66,#5fb0bd);--pet2:light-dark(#e3eff0,#1c3a40);
--ter:light-dark(#b85c38,#e08a62);--ter2:light-dark(#f7e3d8,#3a2419);--are:light-dark(#efe2c9,#2a2a22);
--line:light-dark(#e2d6c2,#2a4248);--ok:light-dark(#2f7d4f,#6cc596);--warn:light-dark(#a8611d,#e5a25a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Nunito,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Baloo 2",Nunito,sans-serif;line-height:1.1;margin:0 0 .4em;text-wrap:balance}
h1{font-size:clamp(28px,4vw,40px)}h2{font-size:24px}h3{font-size:19px}
a{color:var(--pet)}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
nav{background:var(--pet);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}

nav a{color:#fff;text-decoration:none;padding:10px 12px;border-radius:12px;font-weight:600;display:flex;gap:10px;align-items:center;min-height:44px}
nav a:hover{background:rgba(255,255,255,.12)}nav a.on{background:var(--bg);color:var(--pet)}
nav svg{width:20px;height:20px;flex:none}
nav .sig{margin-top:auto;font-size:13px;opacity:.85;padding:10px}nav .sig a{display:inline;padding:0;min-height:0;text-decoration:underline}
main{padding:max(clamp(18px,3vw,40px),env(safe-area-inset-top)) max(4vw,16px) calc(110px + env(safe-area-inset-bottom));max-width:1100px;width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:16px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.mut{color:var(--mut)}.small{font-size:14px}

button.sec,.btn.sec{background:var(--pet2);color:var(--pet)}button.ter{background:var(--ter);color:#fff}button.ghost{background:transparent;color:var(--pet);border:1px solid var(--line)}
button.del{background:transparent;color:var(--ter);border:1px solid var(--ter)}

label{display:block;font-weight:700;font-size:15px;margin:12px 0 4px}
input,select,textarea{font:16px Nunito,sans-serif;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:44px}
textarea{min-height:90px;resize:vertical}
.f2{display:grid;gap:0 16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.chk{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.chk label{font-weight:600;margin:0;display:flex;gap:6px;align-items:center;background:var(--pet2);padding:8px 12px;border-radius:999px;font-size:14px;cursor:pointer}
.chk input{width:18px;height:18px;min-height:0}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--pet2);color:var(--pet)}
.tag.t{background:var(--ter2);color:var(--ter)}.tag.a{background:var(--are);color:var(--ink)}
.kid{display:flex;gap:14px;align-items:center;cursor:pointer}
.av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font:700 20px "Baloo 2";color:#fff;flex:none}
.hero{background:var(--pet);color:#fff;border-radius:22px;padding:22px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:center;margin-bottom:18px}
.hero h1{color:#fff}.hero .mut{color:#d6ecef}
.ring{position:relative;aspect-ratio:1;max-width:260px;justify-self:center;width:100%}
.ring svg{width:100%;height:100%}
.list{display:flex;flex-direction:column;gap:10px}
.item{border-left:5px solid var(--pet);background:var(--card);border-radius:12px;padding:12px 14px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.item.t{border-left-color:var(--ter)}.item.w{border-left-color:var(--warn)}
.time{font:700 22px "Baloo 2";color:var(--ter);white-space:nowrap;min-width:64px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:4px 0 14px;padding-bottom:4px}.tabs button{flex:none}
.seg{display:flex;flex-wrap:wrap;gap:4px}.seg label{margin:0;font-size:13px;font-weight:700;padding:6px 10px;border-radius:999px;border:1px solid var(--line);cursor:pointer;display:flex;align-items:center;gap:4px}
.seg input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}.seg input:checked+span{color:#fff}
.seg label:has(input:checked){background:var(--pet);border-color:var(--pet);color:#fff}.seg label.d:has(input:checked){background:var(--warn);border-color:var(--warn)}.seg label.n:has(input:checked){background:var(--ter);border-color:var(--ter)}
.seg input:focus-visible+span{outline:3px solid var(--ter);outline-offset:3px}
.mk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
@media(max-width:600px){.mk{grid-template-columns:minmax(0,1fr)}}
.out{white-space:pre-wrap;background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:14px;font-size:15px}
.lei{border-top:1px solid var(--line);padding:12px 0}.lei:first-of-type{border-top:0}
.lei b{display:block}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.lock{position:fixed;inset:0;background:var(--pet);display:grid;place-items:center;z-index:10;padding:20px}
.lock .card{max-width:340px;width:100%;text-align:center}
.warnb{background:var(--ter2);color:var(--ter);border-radius:12px;padding:10px 14px;font-weight:600;margin-bottom:14px}
.steps{counter-reset:s}.steps h3{counter-increment:s}.steps h3::before{content:"Etapa " counter(s) ". ";color:var(--ter)}
details summary{cursor:pointer;font-weight:700;padding:6px 0}
@media(max-width:820px){.app{grid-template-columns:minmax(0,1fr)}
nav{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5;overflow-x:auto;gap:2px}
nav .brand,nav .sig{display:none}nav a{flex-direction:column;gap:2px;font-size:11px;padding:6px 8px;flex:none;min-width:62px}
.hero{grid-template-columns:minmax(0,1fr)}.ring{max-width:200px}}
@media(prefers-reduced-motion:no-preference){.ring .dot{transition:transform .6s}.ring:hover .spin{transform:rotate(20deg);transform-origin:50% 50%;transition:transform .8s}}
@media print{nav,.noprint{display:none}.app{display:block}}
</style>
</head>

<script>
{

bp:[['brincar ao lado de outras crianças','compartilhar brinquedos com mediação','separação tranquila da família na chegada','seguir combinados simples da rotina','aceitar ajuda para se acalmar'],['marcha com segurança e subida de pequenos obstáculos','correr, pular e chutar bola','uso da colher para se alimentar','participação na troca e na higiene','movimento de pinça'],['rabiscos com giz e lápis','exploração de tinta, massinha e outros materiais','gestos acompanhando músicas','reconhecimento de cores no dia a dia'],['uso de palavras ou sinais para se comunicar','combinação de duas ou mais palavras','nomeação de objetos e pessoas conhecidas','escuta de histórias curtas até o fim','compreensão de comandos simples'],['encaixar e empilhar peças','separar objetos por cor ou forma','reconhecimento da sequência da rotina','noções de dentro e fora, em cima e embaixo']],
pq:[['brincadeiras de faz de conta com outras crianças','esperar a vez em jogos e conversas','resolução de pequenos conflitos com ajuda do adulto','reconhecer e nomear as próprias emoções','autonomia no autocuidado'],['equilíbrio, saltos e corrida com coordenação','uso da tesoura','preensão adequada do lápis','vestir e calçar peças simples'],['desenho da figura humana','criação com diferentes materiais e cores','cantar e acompanhar ritmos','participação em dramatizações'],['relato de fatos em sequência','reconto de histórias conhecidas','reconhecimento do próprio nome escrito','tentativas de escrita do próprio nome','expressão de ideias nas rodas de conversa'],['contagem de objetos até 10','comparação de quantidades','reconhecimento de formas geométricas simples','observação de transformações','noções de tempo (antes, depois, ontem, amanhã)']]};

const DIAS=['Segunda','Terça','Quarta','Quinta','Sexta'];
const CORES=['#1f5a66','#b85c38','#7a6a2f','#3f7d6a','#8a4f6d','#4a6aa0'];
let S,storeOk=true,dl=null;
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const hoje=()=>new Date().toISOString().slice(0,10);
const fmt=d=>d?d.split('-').reverse().join('/'):'';

function exemplo(){const a=uid(),b=uid();return{cfg:{prof:'',emei:'',regional:'',pin:''},
kids:[{id:a,ex:true,nome:'Criança Exemplo 1',nasc:'2022-03-14',agr:'4 anos',turma:'4 anos B',turno:'Manhã',refp:'Professora referência da turma',resp:'Mãe',tel:'31999990000',pae:'Sim',pub:['TEA'],saude:'Família informa acompanhamento com fonoaudiologia.',interesses:'Dinossauros, músicas com gestos, blocos de encaixe.',horarios:[{dia:'Terça',hora:'09:30',modo:'Colaborativo na turma'},{dia:'Quinta',hora:'14:00',modo:'Sala de recursos'}],
estudo:{data:'2026-03-10',fam:true,e1:'Dificuldade para permanecer na roda e nas transições entre atividades.',m:{'Roda de conversa':'Sai da roda após poucos minutos.','Alimentação':'Seletividade alimentar relatada pela família.'},e3p:'Memoriza canções, reconhece fotos dos colegas, gosta de encaixes.',e3n:'Antecipação da rotina e apoio nas transições.',e4:'Rotina visual na parede da sala e cartão de mudança de atividade.',rec:['Rotina visual com fotos ou pictogramas','Antecipação das mudanças de atividade','Abafador ou redução de ruído']},

{id:b,ex:true,nome:'Criança Exemplo 2',nasc:'2023-08-02',agr:'3 anos',turma:'3 anos A',turno:'Integral',refp:'Professora referência da turma',resp:'Avó',tel:'',pae:'Não',pub:['Em observação (sem laudo)'],saude:'',interesses:'Água, bolhas de sabão.',horarios:[{dia:'Segunda',hora:'10:00',modo:'Observação da rotina'}],estudo:null,paee:null}],
regs:[{id:uid(),kid:a,ex:true,data:'2026-11-18',tipo:'Atendimento colaborativo na turma',pres:'Presente',prop:'Roda com a rotina visual e música de chegada.',resp:'Permaneceu na roda por cerca de 8 minutos e apontou a foto do parque.',prox:'Introduzir a escolha entre duas músicas na prancha.'},
{id:uid(),kid:a,ex:true,data:'2026-11-20',tipo:'Atendimento individual na sala de recursos',pres:'Presente',prop:'Encaixes com pictogramas de cores.',resp:'Nomeou três cores com apoio da prancha.',prox:'Levar a prancha para o momento do lanche.'}]}}
function load(){try{const r=localStorage.getItem(KEY);S=r?JSON.parse(r):exemplo()}catch(e){storeOk=false;S=exemplo()}
S.cfg=S.cfg||{};S.kids=S.kids||[];S.regs=S.regs||[]}

const kidBy=id=>S.kids.find(k=>k.id===id);
function idade(n){if(!n)return'';const d=new Date(n+'T12:00'),t=new Date();let m=(t.getFullYear()-d.getFullYear())*12+t.getMonth()-d.getMonth();if(t.getDate()<d.getDate())m--;if(m<0)return'';const a=Math.floor(m/12),r=m%12;return(a?a+(a>1?' anos':' ano'):'')+(a&&r?' e ':'')+(r?r+(r>1?' meses':' mês'):'')||'recém-nascida'}

if(m==null){const i=AGR.indexOf(k.agr);m=i<0?48:[6,12,24,36,48,60][i]}return m<=18?'bebes':m<48?'bp':'pq'}

if(!k.estudo)p.push({k,t:'Estudo de caso ainda não registrado',go:'estudo'});

function vHoje(){const dn=new Date().getDay(),dia=DIAS[dn-1];const at=[];S.kids.forEach(k=>(k.horarios||[]).forEach(h=>{if(h.dia===dia)at.push({k,h})}));at.sort((a,b)=>a.h.hora.localeCompare(b.h.hora));
const p=pend(),n=S.kids.length,R=40,pts=S.kids.slice(0,12).map((k,i,a)=>{const ang=i/a.length*Math.PI*2-Math.PI/2;return'<g class="dot"><circle cx="'+(60+R*Math.cos(ang)).toFixed(1)+'" cy="'+(60+R*Math.sin(ang)).toFixed(1)+'" r="9" fill="'+cor(k.id)+'" stroke="#fff" stroke-width="2"/><text x="'+(60+R*Math.cos(ang)).toFixed(1)+'" y="'+(63.5+R*Math.sin(ang)).toFixed(1)+'" font-size="8" font-weight="700" fill="#fff" text-anchor="middle">'+esc(ini(k.nome))+'</text></g>'}).join('');
const nome=S.cfg.prof?', '+esc(primeiro(S.cfg.prof)):'';
return'<section class="hero"><div><p class="mut" style="margin:0">'+new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})+'</p><h1>'+(new Date().getHours()<12?'Bom dia':new Date().getHours()<18?'Boa tarde':'Boa noite')+nome+'.</h1><p>'+(at.length?'Você tem '+at.length+(at.length>1?' atendimentos':' atendimento')+' hoje':'Nenhum atendimento marcado para hoje')+' e '+p.length+(p.length===1?' pendência':' pendências')+' no acompanhamento de '+n+(n===1?' criança.':' crianças.')+'</p><div class="row"><button class="ter" data-act="novoReg">Registrar atendimento</button><button class="sec" data-act="go" data-v="assistente">Analisar um caso</button></div></div>'+
'<div class="ring"><svg viewBox="0 0 120 120" role="img" aria-label="Crianças acompanhadas"><g class="spin"><circle cx="60" cy="60" r="'+R+'" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2" stroke-dasharray="3 5"/>'+pts+'</g><text x="60" y="60" text-anchor="middle" font-size="22" font-weight="700" fill="#fff" font-family="Baloo 2">'+n+'</text><text x="60" y="72" text-anchor="middle" font-size="7" fill="#d6ecef">na ciranda</text></svg></div></section>'+
(instEv?'<div class="card row" style="justify-content:space-between"><span><b>Instale o Ciranda AEE</b><br><span class="small mut">Ícone na tela inicial e uso sem internet.</span></span><button data-act="instalar">Instalar</button></div>':'')+'<div class="grid"><div class="card"><h2>Atendimentos de hoje</h2><div class="list">'+(at.length?at.map(({k,h})=>'<div class="item row" data-act="openKid" data-id="'+esc(k.id)+'" style="cursor:pointer"><span class="time">'+esc(h.hora)+'</span><span><b>'+esc(k.nome)+'</b><br><span class="small mut">'+esc(h.modo)+' · '+esc(k.turma||k.agr)+'</span></span></div>').join(''):'<p class="mut">Os horários fixos de cada criança aparecem aqui. Cadastre na ficha da criança, em Horários do AEE.</p>')+'</div></div>'+
'<div class="card"><h2>Pendências</h2><div class="list">'+(p.length?p.slice(0,8).map(x=>'<div class="item '+(x.w?'w':'t')+'" data-act="pend" data-id="'+esc(x.k.id)+'" data-go="'+x.go+'" style="cursor:pointer"><b>'+esc(x.k.nome)+'</b><br><span class="small">'+esc(x.t)+'</span></div>').join(''):'<p class="mut">Tudo em dia.</p>')+'</div></div></div>'+exNote()}
/* CRIANCAS */
function vKids(){if(cur.kid&&kidBy(cur.kid))return vKid(kidBy(cur.kid));
return'<div class="row" style="justify-content:space-between"><h1>Crianças</h1><button data-act="novaKid">Nova criança</button></div><input id="busca" placeholder="Buscar pelo nome ou turma" aria-label="Buscar"><div class="grid" id="klist" style="margin-top:14px">'+kidCards('')+'</div>'+exNote()}
function kidCards(q){q=q.toLowerCase();const l=S.kids.filter(k=>(k.nome+' '+(k.turma||'')).toLowerCase().includes(q));
return l.length?l.map(k=>'<div class="card kid" data-act="openKid" data-id="'+esc(k.id)+'"><div class="av" style="background:'+cor(k.id)+'">'+esc(ini(k.nome))+'</div><div><b>'+esc(k.nome)+'</b><div class="small mut">'+esc(idade(k.nasc))+' · '+esc(k.turma||k.agr||'')+' · '+esc(k.turno||'')+'</div><div class="row" style="gap:4px;margin-top:4px">'+(k.pub||[]).map(p=>'<span class="tag'+(p.startsWith('Em')?' a':'')+'">'+esc(p)+'</span>').join('')+(k.paee?'':'<span class="tag t">sem PAEE</span>')+'</div></div></div>').join(''):'<p class="mut">Nenhuma criança encontrada.</p>'}
function vKid(k){const T=[['ficha','Ficha'],['estudo','Estudo de caso'],['paee','PAEE/PEI'],['hist','Histórico']];
return'<button class="ghost noprint" data-act="voltar">Voltar para a lista</button><div class="row" style="margin:14px 0"><div class="av" style="background:'+cor(k.id)+'">'+esc(ini(k.nome))+'</div><div><h1 style="margin:0">'+esc(k.nome)+'</h1><span class="mut">'+esc(idade(k.nasc))+' · '+esc(k.turma||k.agr||'')+'</span></div></div>'+
'<div class="tabs noprint">'+T.map(([t,l])=>'<button class="'+(cur.tab===t?'':'sec')+'" data-act="tab" data-t="'+t+'">'+l+'</button>').join('')+'</div>'+({ficha:fFicha,estudo:fEstudo,paee:fPaee,hist:fHist}[cur.tab]||fFicha)(k)}
const inp=(n,l,v,t)=>'<div><label for="f_'+n+'">'+l+'</label><input id="f_'+n+'" name="'+n+'" type="'+(t||'text')+'" value="'+esc(v)+'"></div>';
const sel=(n,l,v,o)=>'<div><label for="f_'+n+'">'+l+'</label><select id="f_'+n+'" name="'+n+'"><option value=""></option>'+o.map(x=>'<option'+(x===v?' selected':'')+'>'+esc(x)+'</option>').join('')+'</select></div>';
const ta=(n,l,v,h)=>'<div><label for="f_'+n+'">'+l+'</label>'+(h?'<div class="small mut">'+h+'</div>':'')+'<textarea id="f_'+n+'" name="'+n+'">'+esc(v)+'</textarea></div>';
const chks=(n,o,v)=>'<div class="chk">'+o.map(x=>'<label><input type="checkbox" name="'+n+'" value="'+esc(x)+'"'+((v||[]).includes(x)?' checked':'')+'>'+esc(x)+'</label>').join('')+'</div>';
function fFicha(k){const h=k.horarios||[];return'<form class="card" id="fk"><h2>Ficha da criança</h2><div class="f2">'+inp('nome','Nome completo',k.nome)+inp('nasc','Data de nascimento',k.nasc,'date')+sel('agr','Agrupamento',k.agr,AGR)+inp('turma','Turma',k.turma)+sel('turno','Turno na EMEI',k.turno,['Manhã','Tarde','Integral'])+inp('refp','Professora referência',k.refp)+inp('resp','Responsável (parentesco ou nome)',k.resp)+inp('tel','WhatsApp do responsável (com DDD)',k.tel,'tel')+sel('pae','Tem Profissional de Apoio Escolar (PAE)?',k.pae,['Sim','Não','Em avaliação'])+'</div>'+
'<label>Público do AEE</label><div class="small mut">O laudo não é exigido para o AEE. Use "Em observação" enquanto o estudo de caso estiver em andamento.</div>'+chks('pub',PUB,k.pub)+
ta('interesses','Interesses e o que a criança gosta',k.interesses)+ta('saude','Informações de saúde e terapias que a família autorizou registrar',k.saude,'Registre só o necessário para o trabalho pedagógico (LGPD).')+
'<h3 style="margin-top:18px">Horários do AEE</h3><div id="hrs">'+h.map((x,i)=>hrRow(x,i)).join('')+'</div><button type="button" class="sec" data-act="addHr">Adicionar horário</button>'+
'<div class="row" style="margin-top:18px"><button>Salvar ficha</button><button type="button" class="del" data-act="delKid" data-id="'+esc(k.id)+'">Excluir criança</button></div></form>'}
function hrRow(x,i){return'<div class="f2 hr" style="align-items:end">'+sel('hd'+i,'Dia',x.dia,DIAS)+inp('hh'+i,'Hora',x.hora,'time')+sel('hm'+i,'Modalidade',x.modo,['Sala de recursos','Colaborativo na turma','Observação da rotina','Atendimento à família'])+'</div>'}
function fEstudo(k){const e=k.estudo||{m:{}};return'<form class="card steps" id="fe"><h2 style="counter-increment:none">Estudo de caso</h2><p class="small mut">Segue as quatro etapas do art. 11 do Decreto nº 12.686/2025. A família participa do processo e o resultado fundamenta o PAEE/PEI.</p><div class="f2">'+inp('data','Data',e.data||hoje(),'date')+'</div><div class="chk"><label><input type="checkbox" name="fam" value="1"'+(e.fam?' checked':'')+'>A família participou do estudo de caso</label></div>'+
'<h3>Identificação inicial das demandas e barreiras</h3>'+ta('e1','O que trouxe a criança ao AEE? Quem observou e o quê?',e.e1)+
'<h3>Análise das barreiras no contexto da EMEI</h3><p class="small mut">Descreva o que acontece em cada momento da rotina. Deixe em branco o que não se aplica.</p>'+MOM.map((m,i)=>'<details'+(e.m&&e.m[m]?' open':'')+'><summary>'+m+'</summary><textarea name="m'+i+'" aria-label="'+m+'">'+esc(e.m&&e.m[m])+'</textarea></details>').join('')+
'<h3>Potencialidades e necessidades de apoio</h3>'+ta('e3p','Potencialidades: o que a criança já faz, gosta e consegue',e.e3p)+ta('e3n','Necessidades de apoio',e.e3n)+
'<h3>Estratégias e recursos de acessibilidade</h3>'+ta('e4','Estratégias definidas',e.e4)+chks('rec',REC,e.rec)+
'<div class="row" style="margin-top:18px"><button>Salvar estudo de caso</button>'+(k.estudo?'<button type="button" class="ter" data-act="tab" data-t="paee">Ir para o PAEE/PEI</button>':'')+'</div></form>'}
function fPaee(k){if(!k.estudo)return'<div class="card"><h2>PAEE/PEI</h2><p>O PAEE e o PEI derivam do estudo de caso. Registre o estudo de caso primeiro.</p><button data-act="tab" data-t="estudo">Fazer o estudo de caso</button></div>';
const p=k.paee||{obj:{},rec:k.estudo.rec||[],data:hoje()};const rv=p.rev||'';
return'<form class="card" id="fp"><h2>PAEE/PEI</h2><p class="small mut">Documento pedagógico individual, de atualização contínua, que orienta o trabalho na turma, no AEE e com a família (art. 12 do Decreto nº 12.686/2025).</p><div class="f2">'+inp('data','Data de elaboração',p.data,'date')+inp('rev','Próxima revisão',rv,'date')+inp('freq','Frequência do AEE',p.freq)+inp('dur','Duração de cada atendimento',p.dur)+inp('local','Onde acontece',p.local)+'</div>'+
'<h3 style="margin-top:16px">Objetivos por campo de experiência (BNCC)</h3>'+CAMPOS.map((c,i)=>'<details'+(p.obj&&p.obj[c]?' open':'')+'><summary>'+c+'</summary><textarea name="o'+i+'" aria-label="'+c+'">'+esc(p.obj&&p.obj[c])+'</textarea></details>').join('')+
'<h3 style="margin-top:16px">Recursos de acessibilidade</h3>'+chks('rec',REC,p.rec)+
ta('oprof','Orientações à professora referência',p.oprof)+ta('opae','Orientações ao PAE',p.opae)+ta('ofam','Orientações e combinados com a família',p.ofam)+ta('inter','Articulação intersetorial (saúde, assistência social, terapias)',p.inter)+
'<div class="row" style="margin-top:18px"><button>Salvar PAEE/PEI</button><button type="button" class="sec" data-act="docPaee">Gerar documento</button></div></form><div id="docout"></div>'}
function fHist(k){const r=S.regs.filter(x=>x.kid===k.id).sort((a,b)=>b.data.localeCompare(a.data));
return'<div class="row" style="justify-content:space-between"><h2>Histórico</h2><button data-act="novoReg" data-id="'+esc(k.id)+'">Novo registro</button></div><div class="list">'+(r.length?r.map(regItem).join(''):'<p class="mut">Ainda não há registros.</p>')+'</div>'}
function regItem(x){const k=kidBy(x.kid);return'<div class="item'+(x.pres==='Faltou'?' t':'')+'"><div class="row" style="justify-content:space-between"><b>'+fmt(x.data)+' · '+esc(x.tipo)+'</b><span class="tag'+(x.pres==='Faltou'?' t':'')+'">'+esc(x.pres)+'</span></div>'+(cur.v==='registros'&&k?'<div class="small mut">'+esc(k.nome)+'</div>':'')+(x.prop?'<p style="margin:6px 0 0"><b>Proposta:</b> '+esc(x.prop)+'</p>':'')+(x.resp?'<p style="margin:4px 0 0"><b>Como a criança respondeu:</b> '+esc(x.resp)+'</p>':'')+(x.prox?'<p style="margin:4px 0 0"><b>Próximos passos:</b> '+esc(x.prox)+'</p>':'')+'<button class="ghost small" style="margin-top:6px" data-act="delReg" data-id="'+esc(x.id)+'">Excluir</button></div>'}

return'<h1>Registros</h1><form class="card" id="fr"><h2>Novo registro</h2><div class="f2"><div><label for="f_kid">Criança</label><select id="f_kid" name="kid" required>'+kidOpts(cur.kid)+'</select></div>'+inp('data','Data',hoje(),'date')+sel('tipo','Tipo',TIPOS[0],TIPOS)+sel('pres','Presença',['Presente'],['Presente','Faltou','Não se aplica'])+'</div>'+ta('prop','O que foi proposto','')+ta('resp','Como a criança respondeu (o que fez, comunicou, precisou)','')+ta('prox','Próximos passos','')+'<button style="margin-top:14px">Salvar registro</button></form><h2>Últimos registros</h2><div class="list">'+(r.slice(0,30).map(regItem).join('')||'<p class="mut">Nada registrado ainda.</p>')+'</div>'}

const SIT=[
{id:'falta',t:'A criança está faltando ao AEE',base:'O AEE complementa a escolarização e não a substitui (art. 8º do Decreto nº 12.686/2025). A Política prevê integração com a rede de proteção social (art. 6º).',
an:(k,c)=>{const f=S.regs.filter(x=>x.kid===k.id&&x.pres==='Faltou').length;return[f+' falta(s) registrada(s) no AEE até agora.',k.turno==='Integral'?'A criança é do integral: avalie trocar o atendimento para o formato colaborativo na própria turma, evitando retirá-la da rotina.':'Se o atendimento é no contraturno, confirme com a família se há dificuldade de transporte ou de horário.',f>=3?'Com três faltas ou mais, converse com a coordenação da EMEI sobre acionar a rede de proteção, se houver outros sinais de vulnerabilidade.':'Ainda cabe um contato acolhedor antes de qualquer encaminhamento.']},
enc:f=>f>=3?'Convocar a família para conversa presencial':'Comunicar a família e combinar um novo horário',

{id:'crise',t:'Desregulação ou crise na rotina',base:'O estudo de caso deve analisar as barreiras no contexto escolar e definir estratégias (art. 11). O PAE atua em conformidade com o PAEE/PEI (art. 14).',
an:k=>{const e=k.estudo;return[e?'Releia as barreiras registradas no estudo de caso e veja se a crise ocorreu num momento já mapeado.':'A criança ainda não tem estudo de caso: esta situação é um bom ponto de partida para iniciá-lo.','Registre o antes, o durante e o depois: o que aconteceu antes, como a criança reagiu e o que ajudou a acalmar.',k.pae==='Sim'?'Combine com o PAE e com a professora referência uma resposta única para as próximas vezes.':'Se as crises se repetem e comprometem a participação, o estudo de caso pode indicar a necessidade de PAE (sem exigência de laudo, art. 14, § 2º).','Comunique a família no mesmo dia, sem tom de queixa, focando no que ajudou.']},

{id:'familia',t:'A família não comparece ou não retorna',base:'A família e a criança participam de todo o estudo de caso e do acompanhamento do plano (art. 11, § 3º; art. 7º).',
an:k=>['Verifique se o número de contato está correto e se a família recebe e lê mensagens.','Ofereça horários alternativos, inclusive na entrada ou na saída da criança.','Registre cada tentativa de contato em Registros, tipo "Atendimento ou contato com a família".','Se persistir e houver outros sinais de vulnerabilidade, leve à coordenação da EMEI.'],

{id:'prof',t:'A professora referência pede apoio ou adaptação',base:'O PAEE/PEI orienta o trabalho na sala comum e as atividades colaborativas (art. 12, § 2º). Cabe ao AEE orientar professores sobre recursos e acompanhar seu uso na turma (Resolução CNE/CEB nº 4/2009, art. 13).',
an:k=>{const p=k.paee;return[p?'Leve à professora as orientações já escritas no PAEE/PEI e combine qual será testada primeiro.':'Sem PAEE/PEI, comece por uma observação da rotina na turma.','Prefira uma estratégia por vez, ligada a um momento da rotina (ex.: roda, lanche).','Ofereça modelar a estratégia junto com ela no atendimento colaborativo.',p&&p.rec&&p.rec.length?'Recursos já previstos: '+p.rec.join(', ')+'.':'Defina recursos no PAEE/PEI.']},

{id:'pae',t:'Avaliar se a criança precisa de PAE',base:'A oferta do profissional de apoio é avaliada pelo estudo de caso e não exige laudo (art. 14, § 2º). Na RME-BH, a decisão é da escola, em diálogo com a família, com base em avaliação pedagógica, e a forma de atendimento segue a Nota Técnica DEID/SMED nº 40/2024.',

enc:()=>'Encaminhar à direção da EMEI com o estudo de caso',

{id:'nova',t:'Criança nova, ainda sem diagnóstico',base:'O estudo de caso é a etapa inicial de identificação do público da educação especial e não depende de laudo (art. 11, caput e § 7º). Avaliações de saúde são apenas subsidiárias (art. 11, § 6º).',
an:k=>['Marque o público como "Em observação (sem laudo)".','Observe a criança em vários momentos da rotina antes de concluir.','Converse com a família sobre o desenvolvimento e a rotina em casa, sem falar em diagnóstico.','Se perceber sinais que pedem avaliação de saúde, oriente a família a procurar o centro de saúde, sem condicionar o AEE a isso.'],
enc:()=>'Iniciar o estudo de caso com observação e conversa com a família',

{id:'laudo',t:'A família trouxe laudo ou relatório de terapia',base:'O laudo não é exigido, mas a avaliação biopsicossocial pode subsidiar o estudo de caso (art. 11, §§ 6º e 7º). Dados de saúde são sensíveis e seguem a LGPD (art. 12, § 5º).',

function relTexto(k,ini0,fim){const r=S.regs.filter(x=>x.kid===k.id&&x.data>=ini0&&x.data<=fim).sort((a,b)=>a.data.localeCompare(b.data));const pres=r.filter(x=>x.pres==='Presente').length,fal=r.filter(x=>x.pres==='Faltou').length;
const e=k.estudo||{},p=k.paee||{},n=primeiro(k.nome);const P=[];

if(e.e3p||k.interesses)P.push('No cotidiano da EMEI, '+(e.e3p?'observa-se que '+n+' '+lc(e.e3p)+'.'+(k.interesses?' Demonstra interesse por '+lc(k.interesses)+'.':''):n+' demonstra interesse por '+lc(k.interesses)+'.'));
if(e.e1||e.e3n)P.push('O estudo de caso'+(e.data?', realizado em '+fmt(e.data)+(e.fam?' com a participação da família':''):'')+', identificou '+[e.e1?lc(e.e1):'',e.e3n?'como necessidade de apoio, '+lc(e.e3n):''].filter(Boolean).join('; ')+'.');
if(p.data){const ob=CAMPOS.filter(c=>p.obj&&p.obj[c]).map(c=>'no campo '+c+', '+p.obj[c].replace(/\.$/,'').toLowerCase());P.push('O plano de atendimento, elaborado em '+fmt(p.data)+', prevê atendimento '+(p.freq||'')+(p.local?', '+p.local.toLowerCase():'')+(ob.length?', com os seguintes objetivos: '+ob.join('; '):'')+'.'+(p.rec&&p.rec.length?' Os recursos de acessibilidade utilizados são '+p.rec.map(lc).join(', ')+'.':''))}
if(r.length){P.push('No período foram realizados '+r.length+' registros de acompanhamento, com '+pres+' presença(s)'+(fal?' e '+fal+' falta(s)':'')+'. '+r.filter(x=>x.resp).slice(-4).map(x=>'Em '+fmt(x.data)+', '+x.resp.replace(/\.$/,'').replace(/^./,c=>c.toLowerCase())).join('. ')+(r.some(x=>x.resp)?'.':''))}
const R=k.rel||{};if(R.marcos&&Object.keys(R.marcos).length){const fx=FAIXAS.find(f=>f[0]===R.faixa)||FAIXAS[1],L=MARCOS[fx[0]];const par=[];
CAMPOS.forEach((c,ci)=>{const g={a:[],d:[],n:[]};(L[ci]||[]).forEach((it,ii)=>{const v=R.marcos[fx[0]+ci+'_'+ii];if(v)g[v].push(it)});const pt=[];if(g.a.length)pt.push('apresenta como conquistas já adquiridas '+juntar(g.a));if(g.d.length)pt.push((pt.length?'tem em desenvolvimento ':'tem em desenvolvimento ')+juntar(g.d));if(g.n.length)pt.push((pt.length?'e, por enquanto, ':'')+'ainda não demonstra os marcos de '+juntar(g.n));if(pt.length)par.push('No campo '+c+', '+n+' '+pt.join('; ')+'.')});
if(par.length)P.push('Quanto aos marcos do desenvolvimento, a observação tomou como referência a faixa de '+fx[1].toLowerCase()+' ('+fx[2]+') da BNCC'+(fx[0]!==faixaDe(k)?', escolhida pela professora por se aproximar mais do momento atual de desenvolvimento da criança':'')+'. '+par.join(' '))}
if((R.barr&&R.barr.length)||(R.rec&&R.rec.length))P.push((R.barr&&R.barr.length?'Ainda se observam barreiras nos seguintes aspectos: '+juntar(R.barr)+'. ':'')+(R.rec&&R.rec.length?(R.barr&&R.barr.length?'Para reduzi-las, ':'No período, ')+'foram utilizados recursos e adaptações como '+juntar(R.rec.map(lc))+'.':''));
if(R.cons&&R.cons.trim())P.push(R.cons.trim());
const prox=r.filter(x=>x.prox).slice(-1)[0];P.push('Para a continuidade do trabalho, '+(prox?'propõe-se '+prox.prox.replace(/\.$/,'').replace(/^./,c=>c.toLowerCase()):'propõe-se manter as estratégias do plano')+(p.oprof?', mantendo junto à professora referência a orientação de '+p.oprof.replace(/\.$/,'').replace(/^./,c=>c.toLowerCase()):'')+(p.ofam?' e, com a família, '+p.ofam.replace(/\.$/,'').replace(/^./,c=>c.toLowerCase()):'')+'.');
return P.join('\n\n').replace(/\s—\s|–/g,', ').replace(/\baluno(s)?\b/gi,'criança')}

function confirmBox(msg,cb){const d=$('#conf')||$('#main');const w=document.createElement('div');w.className='warnb';w.innerHTML=esc(msg)+'<div class="row" style="margin-top:8px"><button class="ter" id="cy">Confirmar</button><button class="ghost" id="cn">Cancelar</button></div>';d.prepend(w);w.querySelector('#cy').onclick=()=>{cb();w.remove()};w.querySelector('#cn').onclick=()=>w.remove();w.scrollIntoView({block:'center'})}
async function baixar(nome,conteudo,tipo){if(!dl){try{const u=URL.createObjectURL(new Blob([conteudo],{type:tipo})),a=document.createElement('a');a.href=u;a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Arquivo baixado');return}catch(e){}}if(dl){try{await dl.save({filename:nome,data:new Blob([conteudo],{type:tipo})});toast('Arquivo salvo');return}catch(e){}}try{await navigator.clipboard.writeText(conteudo);toast('Download indisponível aqui. Conteúdo copiado.')}catch(e){toast('Não foi possível baixar. Use Copiar.')}}
function docHTML(titulo,corpo,lista){const c=S.cfg;return'<html><head><meta charset="utf-8"><style>body{font-family:Calibri,Arial;font-size:12pt;margin:2cm}p{text-align:justify}.h{text-align:center;font-weight:bold;margin:0}</style></head><body><p class="h">PREFEITURA MUNICIPAL DE BELO HORIZONTE</p><p class="h">SECRETARIA MUNICIPAL DE EDUCAÇÃO (SMED-BH)</p>'+(c.regional?'<p class="h">'+esc(c.regional.toUpperCase())+'</p>':'')+'<p class="h">'+esc((c.emei||'EMEI').toUpperCase())+'</p><p class="h" style="margin-top:18px">'+esc(titulo)+'</p>'+corpo+'<p style="margin-top:36px">'+esc(c.prof||'')+'<br>Professora do Atendimento Educacional Especializado</p></body></html>'}
function paeeTexto(k){const p=k.paee,e=k.estudo||{};const L=[];L.push('PAEE/PEI de '+k.nome);L.push('- Data de nascimento: '+fmt(k.nasc)+' ('+idade(k.nasc)+')');L.push('- Turma: '+(k.turma||k.agr||'')+(k.turno?', turno '+k.turno:''));L.push('- Professora referência: '+(k.refp||''));L.push('- Elaborado em: '+fmt(p.data)+(p.rev?' | Revisão prevista: '+fmt(p.rev):''));
L.push('','Base do estudo de caso');if(e.e3p)L.push('- Potencialidades: '+e.e3p);if(e.e3n)L.push('- Necessidades de apoio: '+e.e3n);
L.push('','Organização do atendimento');L.push('- Frequência: '+(p.freq||''));L.push('- Duração: '+(p.dur||''));L.push('- Local: '+(p.local||''));
L.push('','Objetivos por campo de experiência');CAMPOS.forEach(c=>{if(p.obj&&p.obj[c])L.push('- '+c+': '+p.obj[c])});
if(p.rec&&p.rec.length){L.push('','Recursos de acessibilidade');p.rec.forEach(r=>L.push('- '+r))}
[['oprof','Orientações à professora referência'],['opae','Orientações ao PAE'],['ofam','Combinados com a família'],['inter','Articulação intersetorial']].forEach(([a,t])=>{if(p[a])L.push('',t,'- '+p[a])});return L.join('\n')}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;
if(a==='go')go(b.dataset.v);
else if(a==='openKid'){cur.kid=id;cur.tab='ficha';go('criancas')}
else if(a==='pend'){cur.kid=id;if(b.dataset.go==='reg'){go('registros')}else if(b.dataset.go==='assist'){cur.sit='falta';go('assistente')}else{cur.tab=b.dataset.go;go('criancas')}}
else if(a==='voltar'){cur.kid=null;render()}
else if(a==='tab'){cur.tab=b.dataset.t;render()}
else if(a==='novaKid'){const k={id:uid(),nome:'Nova criança',horarios:[],pub:[],estudo:null,paee:null};S.kids.push(k);save();cur.kid=k.id;cur.tab='ficha';render()}
else if(a==='delKid')confirmBox('Excluir esta criança e todos os registros dela?',()=>{S.kids=S.kids.filter(k=>k.id!==id);S.regs=S.regs.filter(r=>r.kid!==id);save();cur.kid=null;render();toast('Criança excluída')});
else if(a==='addHr'){const h=$('#hrs');h.insertAdjacentHTML('beforeend',hrRow({},h.children.length))}
else if(a==='novoReg'){if(!S.kids.length){toast('Cadastre uma criança primeiro');return}if(id)cur.kid=id;go('registros')}
else if(a==='delReg')confirmBox('Excluir este registro?',()=>{S.regs=S.regs.filter(r=>r.id!==id);save();render()});
else if(a==='sit'){cur.sit=id;cur.kid=$('#ak').value;render();setTimeout(()=>{const m=$('#msg');m&&m.scrollIntoView({behavior:'smooth',block:'center'})},50)}
else if(a==='copy'){const t=$('#'+b.dataset.src);navigator.clipboard.writeText(t.value).then(()=>toast('Copiado'),()=>{t.select();toast('Selecionado: use Ctrl+C')})}
else if(a==='regSit'){const s=SIT.find(x=>x.id===cur.sit);S.regs.push({id:uid(),kid:cur.kid,data:hoje(),tipo:s.dest==='prof'?'Orientação à professora referência':'Atendimento ou contato com a família',pres:'Não se aplica',prop:s.t+'. '+s.enc(0)+'. Mensagem preparada: '+$('#msg').value,resp:'',prox:''});save();toast('Registrado no histórico')}
else if(a==='docPaee'){const k=kidBy(cur.kid);if(!k.paee){toast('Salve o PAEE/PEI primeiro');return}const t=paeeTexto(k);$('#docout').innerHTML='<div class="card"><h2>Documento do PAEE/PEI</h2><textarea id="ptxt" style="min-height:320px">'+esc(t)+'</textarea><div class="row" style="margin-top:10px"><button data-act="copy" data-src="ptxt">Copiar</button><button class="sec" data-act="baixarP">Baixar para o Word</button></div></div>';$('#docout').scrollIntoView({behavior:'smooth'})}
else if(a==='baixarP'){const k=kidBy(cur.kid),t=$('#ptxt').value;const corpo=t.split('\n').map(l=>l.startsWith('- ')?'<p style="margin:2px 0 2px 18px">&bull; '+esc(l.slice(2))+'</p>':l?'<p><b>'+esc(l)+'</b></p>':'').join('');baixar('PAEE-PEI '+k.nome+'.doc',docHTML('PLANO DE ATENDIMENTO EDUCACIONAL ESPECIALIZADO E PLANO EDUCACIONAL INDIVIDUALIZADO',corpo),'application/msword')}
else if(a==='fx'){salvaMarcos();const k=kidBy(cur.kid);cur.fx=b.dataset.f;if(k&&k.rel){k.rel.faixa=cur.fx;save()}render()}
else if(a==='limpaMk'){document.querySelectorAll('[name="mk_'+id+'"]').forEach(r=>r.checked=false)}
else if(a==='gerRel'){const k=kidBy($('#rk').value);if(!k)return;cur.kid=k.id;salvaMarcos();cur.ri=$('#ri').value;cur.rf=$('#rf').value;cur.rel=relTexto(k,cur.ri,cur.rf);render();setTimeout(()=>{const c=$('#relcard');c&&c.scrollIntoView({behavior:'smooth'})},50)}
else if(a==='baixar'){const k=kidBy(cur.kid),t=$('#reltxt').value;baixar('Relatório AEE '+k.nome+'.doc',docHTML('RELATÓRIO DE ACOMPANHAMENTO DO ATENDIMENTO EDUCACIONAL ESPECIALIZADO',t.split(/\n\s*\n/).map(p=>'<p>'+esc(p)+'</p>').join('')),'application/msword')}
else if(a==='instalar'){if(instEv){instEv.prompt();instEv.userChoice.finally(()=>{instEv=null;render()})}}
else if(a==='backup')baixar('ciranda-aee-backup-'+hoje()+'.json',JSON.stringify(S),'application/json');
else if(a==='copyBk')navigator.clipboard.writeText(JSON.stringify(S)).then(()=>toast('Backup copiado. Cole num lugar seguro.'),()=>toast('Não foi possível copiar'));
else if(a==='semEx'){const ids=S.kids.filter(k=>k.ex).map(k=>k.id);S.kids=S.kids.filter(k=>!k.ex);S.regs=S.regs.filter(r=>!ids.includes(r.kid));save();render();toast('Exemplos removidos')}
else if(a==='apagar')confirmBox('Apagar todas as crianças, registros e ajustes deste aparelho? Faça backup antes.',()=>{S={cfg:{},kids:[],regs:[]};save();render();toast('Dados apagados')});
});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,d=fdata(f);
if(f.id==='fk'){const k=kidBy(cur.kid);const hs=[];f.querySelectorAll('.hr').forEach((r,i)=>{const di=r.querySelector('select[name^=hd]').value,ho=r.querySelector('input[name^=hh]').value,mo=r.querySelector('select[name^=hm]').value;if(di&&ho)hs.push({dia:di,hora:ho,modo:mo||'Sala de recursos'})});
Object.assign(k,{nome:d.nome||'Sem nome',nasc:d.nasc,agr:d.agr,turma:d.turma,turno:d.turno,refp:d.refp,resp:d.resp,tel:d.tel,pae:d.pae,pub:arr(d.pub),interesses:d.interesses,saude:d.saude,horarios:hs});delete k.ex;save();render();toast('Ficha salva')}
else if(f.id==='fe'){const k=kidBy(cur.kid);const m={};MOM.forEach((x,i)=>{if(d['m'+i])m[x]=d['m'+i]});k.estudo={data:d.data,fam:!!d.fam,e1:d.e1,m,e3p:d.e3p,e3n:d.e3n,e4:d.e4,rec:arr(d.rec)};save();render();toast('Estudo de caso salvo')}
else if(f.id==='fp'){const k=kidBy(cur.kid);const o={};CAMPOS.forEach((c,i)=>{if(d['o'+i])o[c]=d['o'+i]});k.paee={data:d.data,rev:d.rev,freq:d.freq,dur:d.dur,local:d.local,obj:o,rec:arr(d.rec),oprof:d.oprof,opae:d.opae,ofam:d.ofam,inter:d.inter};save();render();toast('PAEE/PEI salvo')}
else if(f.id==='fr'){if(!d.kid){toast('Escolha a criança');return}S.regs.push({id:uid(),kid:d.kid,data:d.data,tipo:d.tipo,pres:d.pres,prop:d.prop,resp:d.resp,prox:d.prox});cur.kid=d.kid;save();render();toast('Registro salvo')}
else if(f.id==='fm'){salvaMarcos();render();toast('Marcações salvas')}
else if(f.id==='fc'){if(d.pin&&!/^\d{4}$/.test(d.pin)){toast('O PIN deve ter 4 números');return}S.cfg={prof:d.prof,emei:d.emei,regional:d.regional,pin:d.pin};save();render();toast('Ajustes salvos')}});
document.addEventListener('input',e=>{if(e.target.id==='busca')$('#klist').innerHTML=kidCards(e.target.value)});
document.addEventListener('change',e=>{if(e.target.id==='rk'){cur.kid=e.target.value;cur.fx=null;cur.rel=null;render();return}
if(e.target.id==='ri')cur.ri=e.target.value;if(e.target.id==='rf')cur.rf=e.target.value;
if(e.target.id==='ak'){cur.kid=e.target.value;if(cur.sit)render()}
if(e.target.id==='restore'){const f=e.target.files[0];if(!f)return;f.text().then(t=>{const o=JSON.parse(t);if(!o.kids||!o.regs)throw 0;S=o;save();render();toast('Backup restaurado')}).catch(()=>toast('Arquivo de backup inválido'))}});
function lock(){if(!S.cfg.pin)return;$('#lockwrap').innerHTML='<div class="lock"><form class="card" id="fl"><h2>Ciranda AEE</h2><label for="lp">Digite seu PIN</label><input id="lp" type="password" inputmode="numeric" maxlength="4" autocomplete="off"><button style="margin-top:12px;width:100%;justify-content:center">Entrar</button></form></div>';
$('#fl').addEventListener('submit',ev=>{ev.preventDefault();ev.stopPropagation();if($('#lp').value===S.cfg.pin)$('#lockwrap').innerHTML='';else toast('PIN incorreto')},true);setTimeout(()=>$('#lp').focus(),50)}
function fromHash(){const h=location.hash.slice(1);if(VIEWS.some(v=>v[0]===h)){if(h!==cur.v){cur.v=h;if(h==='criancas')cur.kid=null;render()}}}
window.addEventListener('hashchange',fromHash);
load();const h0=location.hash.slice(1);if(VIEWS.some(v=>v[0]===h0))cur.v=h0;render();lock();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if(window.claude&&window.claude.use)window.claude.use('downloads').then(d=>{dl=d}).catch(()=>{});
}
</script>
